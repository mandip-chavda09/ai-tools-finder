
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 45px 30px;
            background: #141b2d;
            border: 1px solid #27324a;
            border-radius: 20px;
            box-shadow: 0 15px 50px #00000040;
        }

        .error-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #a5b4cc;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .error-code {
            color: #818cf8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a, button {
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .home-btn {
            background: #6366f1;
            color: white;
            border: none;
        }

        .retry-btn {
            background: transparent;
            color: white;
            border: 1px solid #475569;
        }

        .home-btn:hover {
            background: #4f46e5;
        }

        .retry-btn:hover {
            background: #263249;
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="error-icon">⚠️</div>

        <h1>Oops! Something Went Wrong</h1>

        <p>
            We couldn't complete your request.
            please try again later.
        </p>

        <div class="error-code">
            Error Code: {{error}}
        </div>

        <div class="buttons">
            <a href="/" class="home-btn">Back to Home</a>
        </div>

    </main>

</body>
</html>
